<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Browser-local SAML signing-certificate rollover preflight for current, overlap, and final trust.">
  <meta property="og:title" content="SAML Certificate Rollover Preflight"><meta property="og:description" content="Prove old/new signer acceptance before an IdP or ADFS certificate rollover.">
  <title>SAML Certificate Rollover Preflight</title>
  <style>body{font:16px system-ui;max-width:1000px;margin:48px auto;padding:0 20px;color:#172033;background:#f7f9fc}main{background:white;border:1px solid #d8e0ea;border-radius:16px;padding:28px}h1{margin-top:0}textarea{width:100%;min-height:260px;font:13px ui-monospace;box-sizing:border-box}button{background:#155eef;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;background:#101828;color:#e6edf7;padding:18px;border-radius:10px;overflow:auto}.hint{color:#526174}</style>
</head>
<body><main><h1>SAML Certificate Rollover Preflight</h1><p>Prove current → overlap → final trust locally before changing an IdP or ADFS signing certificate. Nothing is uploaded.</p><p class="hint">Paste a contract with embedded <code>currentMetadataXml</code> and <code>nextMetadataXml</code>.</p><textarea id="contract" spellcheck="false" placeholder='{"evaluationTime":"...","currentMetadataXml":"...","nextMetadataXml":"...","trust":{"current":[],"overlap":[],"final":[]}}'></textarea><p><button id="run">Run preflight</button> <button id="download" hidden>Download JSON</button></p><pre id="output">Ready.</pre></main>
<script type="module">import{analyzeContract}from"./src/core.mjs";let report;document.querySelector("#run").onclick=async()=>{const out=document.querySelector("#output");try{report=await analyzeContract(JSON.parse(document.querySelector("#contract").value));out.textContent=JSON.stringify(report,null,2);document.querySelector("#download").hidden=false}catch(error){out.textContent=`INPUT ERROR: ${error.message}`}};document.querySelector("#download").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)+"\n"],{type:"application/json"}));a.download="saml-rollover-report.json";a.click();URL.revokeObjectURL(a.href)}</script></body></html>
